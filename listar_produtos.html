<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/listar_produtos.css">
    
    <title>Produtos</title>

</head>

<body>

<header>
    <h1>🍰 Nossos Produtos</h1>
</header>

<main>

    <div id="listaProdutos" class="product-grid"></div>

    <div class="links">
        <a href="listar_produtos.html">Cadastrar produto</a>
        <a href="gerenciar_produtos.html">Gerenciar produtos</a>
    </div>

</main>

<script>
    function mostrarProdutos() {

        const lista = document.getElementById('listaProdutos');

        const produtos = JSON.parse(localStorage.getItem('produtos')) || [];

        if (produtos.length === 0) {
            lista.innerHTML = `
                <div class="vazio">
                    <h2>Nenhum produto cadastrado</h2>
                    <p>Cadastre um produto para ele aparecer aqui.</p>
                </div>
            `;
            return;
        }

        lista.innerHTML = '';

        produtos.forEach(function(produto) {

            let preco = produto.preco;

            if (produto.precoPromocional) {
                preco = produto.precoPromocional;
            }

            const card = document.createElement('div');

            card.className = 'product-card';

            card.innerHTML = `
                <h3>${produto.nome}</h3>

                <div class="categoria">
                    ${produto.categoria}
                </div>

                <p>${produto.descricao}</p>

                ${
                    produto.precoPromocional
                    ? `<div class="preco-antigo">R$ ${produto.preco.toFixed(2)}</div>`
                    : ''
                }

                <div class="preco">
                    R$ ${preco.toFixed(2)}
                </div>
            `;

            lista.appendChild(card);
        });
    }

    mostrarProdutos();
</script>

</body>
</html>
