
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produtos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: aliceblue;
            margin: 0;
        }

        header {
            background-color: lightblue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: lightblue;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: lightblue;
        }

        #mensagem {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: lightblue;
            margin: 0 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Cadastrar Produtos</h1>
</header>

<main>

    <h2>Novo Produto</h2>

    <form id="formProduto">

        <label for="nome">Nome do produto:</label>
        <input type="text" id="nome" required>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" required></textarea>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" step="0.01" min="0" required>

        <label for="precoPromocional">Preço promocional:</label>
        <input type="number" id="precoPromocional" step="0.01" min="0">

        <label for="categoria">Categoria:</label>
        <select id="categoria" required>
            <option value="">Selecione</option>
            <option value="Bolos">Bolos</option>
            <option value="Doces">Doces</option>
            <option value="Salgados">Salgados</option>
            <option value="Bebidas">Bebidas</option>
        </select>

        <button type="submit">Cadastrar produto</button>

    </form>

    <div id="mensagem"></div>

    <div class="links">
        <a href="produtos.html">Ver produtos</a>
        <a href="gerenciar.html">Gerenciar produtos</a>
    </div>

</main>

<script>
    const form = document.getElementById('formProduto');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', function(event) {

        event.preventDefault();

        let produtos = JSON.parse(localStorage.getItem('produtos')) || [];

        const produto = {
            id: Date.now(),
            nome: document.getElementById('nome').value,
            descricao: document.getElementById('descricao').value,
            preco: Number(document.getElementById('preco').value),
            precoPromocional: document.getElementById('precoPromocional').value
                ? Number(document.getElementById('precoPromocional').value)
                : null,
            categoria: document.getElementById('categoria').value
        };

        produtos.push(produto);

        localStorage.setItem('produtos', JSON.stringify(produtos));

        mensagem.textContent = 'Produto cadastrado com sucesso!';
        mensagem.style.color = 'green';

        form.reset();
    });
</script>

</body>
</html>
