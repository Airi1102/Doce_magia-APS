
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Ingredientes</title>
     <link rel="stylesheet" href="./style/formulario_ingredientes.css">


</head>

<body>

<header>
    <h1>Cadastrar Ingredientes</h1>
</header>

<main>

    <h2>Novo Ingrediente</h2>

    <form id="formIngrediente">

        <label for="nome">Nome do ingrediente:</label>
        <input type="text" id="nome" required>

        <label for="unidade">Unidade de medida:</label>
        <select id="unidade" required>
            <option value="">Selecione</option>
            <option value="kg">Quilograma (kg)</option>
            <option value="g">Grama (g)</option>
            <option value="L">Litro (L)</option>
            <option value="mL">Mililitro (mL)</option>
            <option value="unidade">Unidade</option>
        </select>

        <label for="quantidade">Quantidade em estoque:</label>
        <input type="number" id="quantidade" min="0" step="1" value="0" required>

        <button type="submit">Cadastrar ingrediente</button>

    </form>

    <div id="mensagem"></div>

    <div class="links">
        <a href="estoque_ingredientes.html">Ver estoque</a>
        <a href="gerenciar_ingredientes.html">Gerenciar estoque</a>
    </div>

</main>

<script>

    const form = document.getElementById('formIngrediente');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', function(event) {

        event.preventDefault();

        let ingredientes =
            JSON.parse(localStorage.getItem('ingredientes')) || [];

        const ingrediente = {

            id: Date.now(),

            nome: document.getElementById('nome').value,

            unidade: document.getElementById('unidade').value,

            quantidade: Number(
                document.getElementById('quantidade').value
            )

        };

        ingredientes.push(ingrediente);

        localStorage.setItem(
            'ingredientes',
            JSON.stringify(ingredientes)
        );

        mensagem.textContent =
            'Ingrediente cadastrado com sucesso!';

        mensagem.style.color = 'green';

        form.reset();

        document.getElementById('quantidade').value = 0;

    });

</script>

</body>
</html>
