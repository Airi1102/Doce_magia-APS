<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produtos</title>
     <link rel="stylesheet" href="./style/formulario_produtos.css">

    

</head>

<body>

<header>
    <h1>Cadastrar Produtos</h1>
</header>

<main>

    <h2>Novo Produto</h2>

    <form id="formProduto">

        <label for="nome">Nome do produto:</label>
        <input type="text" id="nome" required>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" required></textarea>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" step="0.01" min="0" required>

        <label for="precoPromocional">Preço promocional:</label>
        <input type="number" id="precoPromocional" step="0.01" min="0">

        <label for="categoria">Categoria:</label>
        <select id="categoria" required>
            <option value="">Selecione</option>
            <option value="Bolos">Bolos</option>
            <option value="Doces">Doces</option>
            <option value="Salgados">Salgados</option>
            <option value="Bebidas">Bebidas</option>
        </select>

        <button type="submit">Cadastrar produto</button>

    </form>

    <div id="mensagem"></div>

    <div class="links">
        <a href="listar_produtos.html">Ver produtos</a>
        <a href="gerenciar_produtos.html">Gerenciar produtos</a>
    </div>

</main>

<script>
    const form = document.getElementById('formProduto');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', function(event) {

        event.preventDefault();

        let produtos = JSON.parse(localStorage.getItem('produtos')) || [];

        const produto = {
            id: Date.now(),
            nome: document.getElementById('nome').value,
            descricao: document.getElementById('descricao').value,
            preco: Number(document.getElementById('preco').value),
            precoPromocional: document.getElementById('precoPromocional').value
                ? Number(document.getElementById('precoPromocional').value)
                : null,
            categoria: document.getElementById('categoria').value
        };

        produtos.push(produto);

        localStorage.setItem('produtos', JSON.stringify(produtos));

        mensagem.textContent = 'Produto cadastrado com sucesso!';
        mensagem.style.color = 'green';

        form.reset();
    });
</script>

</body>
</html>
