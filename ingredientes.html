
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Ingredientes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: aliceblue;
            margin: 0;
        }

        header {
            background-color: lightblue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 25px;
        }

        .ingrediente {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .ingrediente h3 {
            margin: 0 0 10px 0;
        }

        .quantidade {
            font-size: 18px;
            font-weight: bold;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: lightblue;
            margin: 0 10px;
        }

        .vazio {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Estoque de Ingredientes</h1>
</header>

<main>

    <h2>Ingredientes em estoque</h2>

    <div id="listaEstoque"></div>

    <div class="links">
        <a href="estoque.html">Cadastrar ingrediente</a>
        <a href="gerenciar_ingredientes.html">Gerenciar estoque</a>
    </div>

</main>

<script>

    const listaEstoque = document.getElementById('listaEstoque');

    const ingredientes =
        JSON.parse(localStorage.getItem('ingredientes')) || [];

    if (ingredientes.length === 0) {

        listaEstoque.innerHTML =
            '<div class="vazio">Nenhum ingrediente cadastrado.</div>';

    } else {

        ingredientes.forEach(function(ingrediente) {

            const div = document.createElement('div');

            div.className = 'ingrediente';

            div.innerHTML = `
                <h3>${ingrediente.nome}</h3>

                <div class="quantidade">
                    Quantidade: ${ingrediente.quantidade}
                    ${ingrediente.unidade}
                </div>
            `;

            listaEstoque.appendChild(div);
        });
    }

</script>

</body>
</html>
