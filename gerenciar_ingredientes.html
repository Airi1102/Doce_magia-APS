<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Estoque</title>
    <link rel="stylesheet" href="./style/gerenciar_ingredientes.css">

</head>

<body>

<header>
    <h1>Gerenciar Estoque</h1>
</header>

<main>

    <h2>Quantidade dos ingredientes</h2>

    <div id="listaEstoque"></div>

    <div id="mensagem" class="mensagem"></div>

    <div class="links">
        <a href="estoque_ingredientes.html">Ver estoque</a>
        <a href="formulario_ingredientes.html">Cadastrar ingrediente</a>
    </div>

</main>

<script>

    const listaEstoque = document.getElementById('listaEstoque');
    const mensagem = document.getElementById('mensagem');

    let ingredientes =
        JSON.parse(localStorage.getItem('ingredientes')) || [];

    function mostrarIngredientes() {

        listaEstoque.innerHTML = '';

        if (ingredientes.length === 0) {

            listaEstoque.innerHTML =
                '<p>Nenhum ingrediente cadastrado.</p>';

            return;
        }

        ingredientes.forEach(function(ingrediente, index) {

            const div = document.createElement('div');

            div.className = 'ingrediente';

            div.innerHTML = `
                <h3>${ingrediente.nome}</h3>

                <div class="controle">

                    <button type="button"
                        onclick="diminuirQuantidade(${index})">
                        −
                    </button>

                    <input
                        type="number"
                        min="0"
                        value="${ingrediente.quantidade}"
                        id="quantidade-${index}"
                    >

                    <button type="button"
                        onclick="aumentarQuantidade(${index})">
                        +
                    </button>

                    <span class="unidade">
                        ${ingrediente.unidade}
                    </span>

                </div>
            `;

            listaEstoque.appendChild(div);
        });
    }


    function aumentarQuantidade(index) {

        ingredientes[index].quantidade++;

        salvarEstoque();

        mostrarIngredientes();

        mostrarMensagem();
    }


    function diminuirQuantidade(index) {

        if (ingredientes[index].quantidade > 0) {

            ingredientes[index].quantidade--;

            salvarEstoque();

            mostrarIngredientes();

            mostrarMensagem();
        }
    }


    function salvarEstoque() {

        localStorage.setItem(
            'ingredientes',
            JSON.stringify(ingredientes)
        );
    }


    function mostrarMensagem() {

        mensagem.textContent =
            'Estoque atualizado com sucesso!';

        setTimeout(function() {

            mensagem.textContent = '';

        }, 2000);
    }


    mostrarIngredientes();

</script>

</body>
</html>
